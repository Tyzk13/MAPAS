<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Visualizador de modelo</title>
<style>html,body{margin:0;height:100%;background:#222}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Visualizador para conferir assets: /tools/visualizador.html?glb=/caminho/modelo.glb
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const Q = new URLSearchParams(location.search);
const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
R.setSize(innerWidth, innerHeight, false); R.toneMapping = THREE.AgXToneMapping; R.shadowMap.enabled = true;
const S = new THREE.Scene(); S.background = new THREE.Color(0x5a6270);
S.environment = new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(), 0.04).texture; S.environmentIntensity = 0.6;
const sun = new THREE.DirectionalLight(0xffffff, 2.5); sun.position.set(5, 10, 6); sun.castShadow = true; S.add(sun);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 500);
const gnd = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x3a3f36 })); gnd.rotation.x = -Math.PI / 2; gnd.receiveShadow = true; S.add(gnd);
const gl = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(Q.get('glb'));
const o = gl.scene; S.add(o);
let tris = 0; o.traverse(m => { if (m.isMesh) { m.castShadow = m.receiveShadow = true; tris += (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3; } });
const bb = new THREE.Box3().setFromObject(o), sz = bb.getSize(new THREE.Vector3()), c = bb.getCenter(new THREE.Vector3());
const r = Math.max(sz.x, sz.y, sz.z);
Object.assign(sun.shadow.camera, { left: -r, right: r, top: r, bottom: -r, far: 60 }); sun.shadow.mapSize.set(2048, 2048);
window.__info = { tris: Math.round(tris), size: sz.toArray().map(v => +v.toFixed(2)) };
window.__shot = (az, el = 0.25, dist = 1.6) => {
  cam.position.set(c.x + Math.sin(az) * r * dist, c.y + r * el, c.z + Math.cos(az) * r * dist); cam.lookAt(c);
  R.render(S, cam); return R.domElement.toDataURL('image/jpeg', 0.85);
};
window.__ready = true;
</script></body></html>
